<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <groupbox>
    <html:label><html:h3>连接 Joplin</html:h3></html:label>

    <vbox style="margin-bottom: 8px;">
      <html:label style="color: gray;"
        >在 Joplin 设置 → Web Clipper（网页剪藏器）中启用服务。</html:label
      >
    </vbox>

  <vbox>
    <html:label for="zotero-prefpane-__addonRef__-joplinBaseUrl"
      >Joplin API 地址</html:label
    >
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-joplinBaseUrl"
      preference="joplinBaseUrl"
      style="width: 32em;"
    ></html:input>
    <html:label style="color: gray;"
      >默认 http://127.0.0.1:41184。</html:label
    >
  </vbox>

  <vbox>
    <html:label for="zotero-prefpane-__addonRef__-joplinToken"
      >Joplin Token</html:label
    >
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-joplinToken"
      preference="joplinToken"
      style="width: 32em;"
    ></html:input>
    <html:label style="color: gray;"
      >复制 Web Clipper（网页剪藏器）中的授权 Token。</html:label
    >
    <hbox align="center" style="margin-top: 8px;">
      <html:button id="zotero-prefpane-__addonRef__-testConnection"
        >测试 Joplin 连接</html:button
      >
      <html:label
        id="zotero-prefpane-__addonRef__-connectionStatus"
        style="margin-left: 1em;"
      ></html:label>
    </hbox>
  </vbox>
  </groupbox>

  <groupbox>
    <html:label><html:h3>导出位置</html:h3></html:label>

    <vbox>
      <checkbox
        id="zotero-prefpane-__addonRef__-modeAsk"
        label="每次导出时选择"
      />
      <checkbox
        id="zotero-prefpane-__addonRef__-modeDefault"
        label="使用默认位置"
      />
    </vbox>

    <vbox
      id="zotero-prefpane-__addonRef__-defaultLocationBox"
      style="margin-left: 1.5em;"
    >
      <radiogroup
        id="zotero-prefpane-__addonRef__-defaultLocationSourceGroup"
        preference="defaultLocationSource"
        orient="vertical"
      >
        <vbox>
          <hbox align="start">
            <radio
              id="zotero-prefpane-__addonRef__-sourceFixed"
              label="设置默认笔记本"
              value="fixed"
            />
            <html:label
              id="zotero-prefpane-__addonRef__-notebookStatus"
              style="color: red; margin-left: 8px; flex: 1; min-width: 0; max-width: 32em; white-space: normal; overflow-wrap: anywhere; word-break: break-word;"
            ></html:label>
          </hbox>
          <vbox
            id="zotero-prefpane-__addonRef__-defaultNotebookBox"
            style="margin-left: 1.5em;"
          >
            <hbox align="center">
              <html:input
                type="text"
                id="zotero-prefpane-__addonRef__-notebookName"
                preference="notebookName"
                placeholder="Zotero"
                readonly="true"
                style="width: 24em;"
              ></html:input>
              <html:button id="zotero-prefpane-__addonRef__-chooseNotebook"
                >选择</html:button
              >
            </hbox>
          </vbox>
        </vbox>

        <vbox>
          <radio
            id="zotero-prefpane-__addonRef__-sourceCollections"
            label="跟随 Zotero 分类树"
            value="collections"
          />
          <vbox
            id="zotero-prefpane-__addonRef__-collectionsHelp"
            style="margin-left: 1.5em;"
          >
            <html:label style="color: gray;"
              >跟随当前导出视图指示分类；视图未指示分类时导出到 Zotero 目录。</html:label
            >
          </vbox>
        </vbox>
      </radiogroup>
    </vbox>
  </groupbox>

  <groupbox>
    <html:label><html:h3>导出内容</html:h3></html:label>
    <html:label style="color: gray; margin-bottom: 6px; display: block;"
      >默认导出条目信息、Zotero 笔记和 PDF 注释。以下为可选内容。</html:label
    >
    <vbox>
      <checkbox
        id="zotero-prefpane-__addonRef__-includeImages"
        preference="includeImages"
        label="包含图片/绘图注释（上传为 Joplin 资源）"
      />
      <checkbox
        id="zotero-prefpane-__addonRef__-includeAbstract"
        preference="includeAbstract"
        label="包含摘要"
      />
      <checkbox
        id="zotero-prefpane-__addonRef__-includeTags"
        preference="includeTags"
        label="把 Zotero 标签同步为 Joplin 标签"
      />
    </vbox>
  </groupbox>

  <vbox style="margin-top: 8px;">
    <html:label style="color: gray;"
      >使用方法：在 Zotero 条目列表右键 → “导出内容到 Joplin”。</html:label
    >
  </vbox>

</groupbox>
